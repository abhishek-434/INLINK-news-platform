services:
  - type: web
    name: inkline-publishing
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inkline-postgres
          property: connectionString

databases:
  - name: inkline-postgres
    databaseName: inkline
    user: inkline_user
    plan: free
