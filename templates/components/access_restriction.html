<div class="access-restriction-box my-4">
    <div class="lock-icon">
        <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h3 class="font-serif fw-bold mb-2">Enjoying this story?</h3>
    <p class="text-secondary mx-auto mb-4" style="max-width: 540px; font-size: 1.05rem;">
        Create a free account or log in to continue reading the complete article, explore in-depth analyses, save bookmarks, and participate in editorial discussions.
    </p>

    <div class="d-flex flex-column flex-sm-row justify-content-center align-items-center gap-3">
        <a href="{% url 'login' %}?next={{ request.path|urlencode }}" class="btn btn-ink-primary px-4 py-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Log In to Continue
        </a>
        <a href="{% url 'register' %}?next={{ request.path|urlencode }}" class="btn btn-ink-outline px-4 py-2">
            <i class="bi bi-person-plus me-1"></i> Create Free Account
        </a>
    </div>

    <div class="mt-4 text-muted small">
        <i class="bi bi-check-circle me-1 text-success"></i> 100% Free Access • No Credit Card Required • Read Anywhere
    </div>
</div>
